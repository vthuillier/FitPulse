version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fitpulse_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitpulse_db}
      POSTGRES_USER: ${POSTGRES_USER:-fitpulse_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitpulse_user} -d ${POSTGRES_DB:-fitpulse_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: fitpulse_backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-fitpulse_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - see .env.example}@postgres:5432/${POSTGRES_DB:-fitpulse_db}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in .env - see .env.example}
      FIRST_ADMIN_EMAIL: ${FIRST_ADMIN_EMAIL:-admin@fitpulse.com}
      FIRST_ADMIN_PASSWORD: ${FIRST_ADMIN_PASSWORD:?Set FIRST_ADMIN_PASSWORD in .env - see .env.example}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    container_name: fitpulse_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
